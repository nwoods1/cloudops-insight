spring.application.name=backend
aws.region=us-east-2
aws.dynamodb.incidentsTable=Incidents
aws.dynamodb.metricsTable=Metrics
aws.s3.bucketName=cloudops-insight--uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
aws.bedrock.modelId=global.amazon.nova-2-lite-v1:0
# Secrets are read from environment variables (or an untracked backend/.env file).
# See .env.example. Never commit real values here.
spring.config.import=optional:file:.env[.properties]
app.auth.username=${APP_AUTH_USERNAME:admin}
app.auth.password=${APP_AUTH_PASSWORD}
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=86400000